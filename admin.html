<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>운영자 · 선생님 이력서 소개팅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
  <header class="admin-bar">
    <h1>운영자</h1>
    <button type="button" class="btn btn-ghost-light" id="logout" hidden>로그아웃</button>
  </header>

  <!-- 로그인 -->
  <section id="login-view" class="wrap login" hidden>
    <h2>운영자 로그인</h2>
    <form id="login-form">
      <div class="field">
        <label for="login-email">이메일</label>
        <input id="login-email" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-pw">비밀번호</label>
        <input id="login-pw" type="password" required autocomplete="current-password">
      </div>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button class="btn btn-pink" type="submit">로그인</button>
    </form>
  </section>

  <p id="config-warning" class="wrap notice" hidden>config.js에 Supabase 주소와 키를 넣어야 관리자 화면을 쓸 수 있어요.</p>

  <!-- 결과 -->
  <main id="data-view" hidden>
    <nav class="tabs wrap-wide" role="tablist">
      <button role="tab" aria-selected="true" data-tab="resumes">이력서 <span id="count-resumes"></span></button>
      <button role="tab" aria-selected="false" data-tab="matches">매칭 <span id="count-matches"></span></button>
      <button role="tab" aria-selected="false" data-tab="stats">통계</button>
      <button role="tab" aria-selected="false" data-tab="feedback">피드백 <span id="count-feedback"></span></button>
    </nav>

    <section id="tab-resumes" class="wrap-wide" role="tabpanel">
      <div class="filters" role="group" aria-label="상태로 보기">
        <button class="filter is-on" data-status="">전체</button>
        <button class="filter" data-status="검토 대기">검토 대기</button>
        <button class="filter" data-status="공개">공개</button>
        <button class="filter" data-status="비공개">비공개</button>
        <button class="filter" data-status="매칭 완료">매칭 완료</button>
      </div>
      <div id="resume-list" class="cards"></div>
      <p id="resume-empty" class="empty" hidden>아직 들어온 이력서가 없어요. 이력서 링크를 공유해 보세요.</p>
    </section>

    <section id="tab-matches" class="wrap-wide" role="tabpanel" hidden>
      <form id="new-match" class="panel" novalidate>
        <h2>새 매칭 기록</h2>
        <p class="hint">남성분께 먼저 프로필을 보여드린 뒤 기록해 주세요. 비공개이거나 지금 만남 중인 회원은 목록에 나오지 않아요.</p>
        <div class="row">
          <div class="field">
            <label for="nm-man">남성</label>
            <select id="nm-man"><option value="">고르세요</option></select>
          </div>
          <div class="field">
            <label for="nm-woman">여성</label>
            <select id="nm-woman"><option value="">고르세요</option></select>
          </div>
        </div>
        <div id="nm-fit" aria-live="polite"></div>
        <p id="nm-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn btn-pink">남성에게 제안함으로 기록</button>
      </form>

      <div class="filters" role="group" aria-label="매칭 단계로 보기">
        <button class="filter mfilter is-on" data-f="open">답 기다리는 중</button>
        <button class="filter mfilter" data-f="meeting">만남 중</button>
        <button class="filter mfilter" data-f="ended">끝난 매칭</button>
        <button class="filter mfilter" data-f="all">전체</button>
      </div>
      <div id="match-list" class="match-list"></div>
      <p id="match-empty" class="empty" hidden>여기에 해당하는 매칭이 없어요.</p>
    </section>

    <section id="tab-stats" class="wrap-wide" role="tabpanel" hidden>
      <div id="stats"></div>
    </section>

    <section id="tab-feedback" class="wrap-wide" role="tabpanel" hidden>
      <table class="fb-table">
        <thead><tr><th>날짜</th><th>유형</th><th>내용</th><th>처리</th></tr></thead>
        <tbody id="feedback-list"></tbody>
      </table>
      <p id="feedback-empty" class="empty" hidden>아직 들어온 피드백이 없어요.</p>
    </section>
  </main>

  <template id="card-tpl">
    <article class="card">
      <img class="card-photo" alt="">
      <div class="card-body">
        <header class="card-head">
          <h3 class="card-name"></h3>
          <select class="card-status" aria-label="상태 바꾸기">
            <option>검토 대기</option><option>공개</option><option>비공개</option><option>매칭 완료</option>
          </select>
        </header>
        <p class="card-intro"></p>
        <dl class="card-meta"></dl>
        <details class="card-more">
          <summary>이력서 전체 보기</summary>
          <dl class="card-detail"></dl>
          <div class="card-extras"></div>
        </details>
        <div class="card-contact">
          <h4>연락처 (비공개)</h4>
          <dl class="contact-detail"></dl>
        </div>
        <div class="card-foot">
          <button type="button" class="btn-link card-delete">이력서 삭제</button>
        </div>
      </div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
